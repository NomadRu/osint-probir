<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Таймер до Субботы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* ЗАПРЕЩАЕМ СКРОЛЛ */
        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* ЗАДНИЙ ФОН — fone.jpg на весь экран */
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('fone.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Montserrat', 'Courier New', monospace;
            overflow: hidden;
        }

        /* КАРТОЧКА С ФОТО fon.jpg */
        .photo-card {
            max-width: 1100px;
            width: 90%;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            aspect-ratio: 16 / 9;
        }

        .photo-bg {
            width: 100%;
            height: 100%;
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* ПАНЕЛЬ ТАЙМЕРА — ТОЛЬКО ЦИФРЫ И ПОДПИСИ */
        .timer-container {
            text-align: center;
            width: 92%;
            max-width: 800px;
            padding: 1rem;
            border: none;
        }

        /* Сетка таймера — ТОЛЬКО НОЖКИ */
        .countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin: 0;
        }

        .time-block {
            text-align: center;
            min-width: 90px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
            padding-bottom: 0.5rem;
        }

        .time-number {
            font-size: 3.8rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 2px 5px black;
            line-height: 1;
        }

        .milli-number {
            font-size: 2rem;
            font-weight: 800;
            color: #ffe0a3;
            text-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 5px black;
            margin-top: 8px;
        }

        .milli-block {
            min-width: 130px;
        }

        /* Кнопка включения звука */
        .sound-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            cursor: pointer;
            z-index: 999;
            font-family: monospace;
            font-weight: bold;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }

        .sound-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.05);
        }

        /* Адаптация под мобильные */
        @media (max-width: 800px) {
            .time-number { font-size: 2.5rem; letter-spacing: 2px; }
            .milli-number { font-size: 1.4rem; }
            .time-block { min-width: 70px; }
            .milli-block { min-width: 100px; }
            .timer-container { padding: 0.5rem; }
            .photo-card { width: 95%; }
        }

        @media (max-width: 550px) {
            .time-number { font-size: 1.8rem; }
            .milli-number { font-size: 1rem; }
            .time-label { font-size: 0.65rem; }
            .countdown { gap: 0.8rem; }
            .sound-btn { padding: 6px 12px; font-size: 10px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="photo-card">
        <div class="photo-bg">
            <div class="timer-container">
                <div class="countdown">
                    <div class="time-block">
                        <div class="time-number" id="days">00</div>
                        <div class="time-label">ДНЕЙ</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="hours">00</div>
                        <div class="time-label">ЧАСОВ</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="minutes">00</div>
                        <div class="time-label">МИНУТ</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="seconds">00</div>
                        <div class="time-label">СЕКУНД</div>
                    </div>
                    <div class="time-block milli-block">
                        <div class="time-number milli-number" id="milliseconds">000</div>
                        <div class="time-label">МИЛЛИСЕКУНД</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="sound-btn" id="enableSoundBtn">🔊 ВКЛЮЧИТЬ ЗВУК</button>

<script>
    (function() {
        let audio = null;
        let soundEnabled = false;
        let lastSecond = -1;
        
        function initAudio() {
            if (!audio) {
                audio = new Audio('sound.mp3');
                audio.preload = 'auto';
                audio.volume = 0.15;
            }
        }
        
        function playTick() {
            if (!soundEnabled) return;
            try {
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log('Звук не воспроизвёлся:', e));
                }
            } catch(e) { console.log(e); }
        }
        
        const btn = document.getElementById('enableSoundBtn');
        btn.addEventListener('click', () => {
            initAudio();
            soundEnabled = true;
            audio.play().then(() => {
                btn.textContent = '🔊 ЗВУК АКТИВЕН ✅';
                btn.style.background = 'rgba(0,150,0,0.8)';
                setTimeout(() => {
                    btn.style.background = 'rgba(0,0,0,0.7)';
                }, 1000);
            }).catch(e => {
                console.warn('Автовоспроизведение заблокировано');
                btn.textContent = '✅ ЗВУК ВКЛЮЧЁН';
            });
            setTimeout(() => {
                if(btn.textContent !== '🔊 ЗВУК АКТИВЕН ✅')
                    btn.textContent = '🔊 ЗВУК АКТИВЕН ✅';
            }, 500);
        });
        
        function getNextSaturdayMidnight() {
            const now = new Date();
            const currentDay = now.getDay();
            let daysToAdd = 0;
            if (currentDay === 6) daysToAdd = 7;
            else if (currentDay === 0) daysToAdd = 6;
            else daysToAdd = (6 - currentDay);
            const target = new Date(now);
            target.setDate(now.getDate() + daysToAdd);
            target.setHours(0, 0, 0, 0);
            if (target <= now) target.setDate(target.getDate() + 7);
            return target;
        }
        
        const daysSpan = document.getElementById('days');
        const hoursSpan = document.getElementById('hours');
        const minutesSpan = document.getElementById('minutes');
        const secondsSpan = document.getElementById('seconds');
        const millisecondsSpan = document.getElementById('milliseconds');
        
        function updateTimer() {
            const now = new Date();
            let target = getNextSaturdayMidnight();
            let diff = target - now;
            if (diff < 0) {
                target = getNextSaturdayMidnight();
                diff = target - now;
                if (diff < 0) diff = 0;
            }
            
            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = diff % 1000;
            
            daysSpan.textContent = days < 10 ? '0' + days : '' + days;
            hoursSpan.textContent = hours < 10 ? '0' + hours : '' + hours;
            minutesSpan.textContent = minutes < 10 ? '0' + minutes : '' + minutes;
            secondsSpan.textContent = seconds < 10 ? '0' + seconds : '' + seconds;
            
            let msFormatted = milliseconds;
            if (milliseconds < 10) msFormatted = '00' + milliseconds;
            else if (milliseconds < 100) msFormatted = '0' + milliseconds;
            millisecondsSpan.textContent = msFormatted;
            
            if (soundEnabled && seconds !== lastSecond) {
                lastSecond = seconds;
                playTick();
            }
        }
        
        let animFrame;
        function tick() {
            updateTimer();
            animFrame = requestAnimationFrame(tick);
        }
        tick();
        
        document.body.addEventListener('click', function initOnClick() {
            if (!audio) {
                initAudio();
                soundEnabled = true;
                audio.play().catch(e => console.log('тихо'));
                btn.textContent = '🔊 ЗВУК АКТИВЕН ✅';
                document.body.removeEventListener('click', initOnClick);
            }
        });
        
        console.log('✅ Таймер работает | Текст убран | Только цифры');
    })();
</script>
</body>
</html>
